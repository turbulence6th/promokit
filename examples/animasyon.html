<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>HTML animation</title>
<!--
  A full-frame HTML animation. Nothing here is promokit-specific except two optional hooks:
    • CSS @keyframes/transitions are pinned to the video's frame clock — use them freely.
    • `promo.on('frame', ({ t }) => …)` runs once per video frame with the scene time `t` (seconds) — use it for
      anything CSS can't express (counters, canvas, data-driven layout). `promo.params` carries values from the TOML.
  ⛔ Don't keep time with setTimeout / requestAnimationFrame / Date.now: the page is stepped frame by frame, not played.
  The page is laid out in vmin/vw/vh units, so the same file renders in 16:9, 9:16, 1:1…
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { display: grid; place-items: center; color: #fff;
         font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: radial-gradient(120% 100% at 15% 0%, #2a3a9a 0%, #0c1030 62%); }
  .stage { width: 88vw; text-align: center; }
  h1 { margin: 0; font-size: 10vmin; line-height: 1.05; letter-spacing: -.02em; }
  .w { display: inline-block; opacity: 0; transform: translateY(.55em) scale(.94); margin: 0 .14em;
       animation: up .8s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes up { to { opacity: 1; transform: none; } }
  .num { margin-top: 5vmin; font-size: 17vmin; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
  .num small { font-size: .45em; opacity: .7; margin-left: .06em; }
  .bar { width: 56vmin; max-width: 70%; height: 1.4vmin; margin: 3vmin auto 0; border-radius: 99px; background: rgba(255,255,255,.16); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #6ea0ff, #c08bff);
           animation: fill 3.2s 1s cubic-bezier(.65,0,.35,1) forwards; }
  @keyframes fill { to { width: 100%; } }
  svg { position: absolute; right: 6vmin; top: 6vmin; width: 12vmin; height: 12vmin; }
  svg circle { fill: none; stroke: #8fb4ff; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: 289;
               transform: rotate(-90deg); transform-origin: 50% 50%; animation: ring 3.2s 1s cubic-bezier(.65,0,.35,1) forwards; }
  @keyframes ring { to { stroke-dashoffset: 0; } }
</style>
<div class="stage">
  <h1 id="h"></h1>
  <div class="num"><span id="n">0</span><small>%</small></div>
  <div class="bar"><i></i></div>
</div>
<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg>
<script>
  const P = window.promo;                                        // undefined in a normal browser → show the end state
  const headline = (P && P.params.headline) || 'HTML in, video out.';
  const h = document.getElementById('h');
  headline.split(' ').forEach((word, i) => {
    const s = document.createElement('span');
    s.className = 'w'; s.textContent = word; s.style.animationDelay = (0.15 + i * 0.12) + 's';
    h.appendChild(s);
  });
  const n = document.getElementById('n');
  if (P) P.on('frame', ({ t }) => { n.textContent = Math.round(100 * P.ease((t - 1) / 3.2, 'inout')); });
  else n.textContent = '100';
</script>
